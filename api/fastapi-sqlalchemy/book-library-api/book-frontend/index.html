<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📚 Book Tracker</h1>

        <!-- Auth Section -->
        <div class="card" id="auth-section">
            <div class="tabs">
                <button class="tab active" onclick="switchTab('login')">Login</button>
                <button class="tab" onclick="switchTab('register')">Register</button>
            </div>

            <form id="login-form">
                <h2>Login</h2>
                <input type="text" id="login-username" placeholder="Username" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <button type="submit">Login</button>
                <p class="message" id="login-message"></p>
            </form>

            <form id="register-form" style="display:none;">
                <h2>Register</h2>
                <input type="text" id="register-username" placeholder="Username" required>
                <input type="password" id="register-password" placeholder="Password" required>
                <button type="submit">Register</button>
                <p class="message" id="register-message"></p>
            </form>
        </div>

        <!-- Books Section -->
        <div class="card" id="books-section" style="display:none;">
            <div class="books-header">
                <h2>My Books</h2>
                <button onclick="logout()" class="logout-btn">Logout</button>
            </div>

            <form id="add-book-form">
                <input type="text" id="book-title" placeholder="Title" required>
                <input type="text" id="book-author" placeholder="Author" required>
                <button type="submit">Add Book</button>
                <p class="message" id="book-message"></p>
            </form>

            <ul id="book-list"></ul>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
